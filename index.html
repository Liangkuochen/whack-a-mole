<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🐹 打地鼠大作戰</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at top, #fff8d8 0%, #d8f5c8 45%, #9bd18b 100%);

    color: #3d3d3d;
    overflow-x: hidden;
}

.game {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 12px;
}

/* =========================
   標題
========================= */

.header {
    text-align: center;
    margin-bottom: 10px;
}

.title {
    margin: 5px 0 2px;
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 900;
    color: #5b351f;
    text-shadow: 2px 3px 0 #fff;
}

.subtitle {
    font-size: 14px;
    color: #76553e;
}

/* =========================
   資訊列
========================= */

.info {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 10px;
}

.info-box {
    background: rgba(255,255,255,.9);
    border-radius: 15px;
    padding: 8px 4px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
}

.info-label {
    font-size: 11px;
    color: #8a7767;
}

.info-value {
    font-size: 21px;
    font-weight: 900;
    color: #4b301e;
}

/* =========================
   按鈕
========================= */

.controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

button {
    border: 0;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
}

.control-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 15px;
    font-size: 15px;
    color: white;
    background: #7a4d2b;
    box-shadow: 0 5px 0 #4d2e1b;
    transition: .1s;
}

.control-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #4d2e1b;
}

.music-btn {
    background: #497cbd;
    box-shadow: 0 5px 0 #2c527f;
}

/* =========================
   關卡
========================= */

.level-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

.level {
    flex: 1;
    padding: 7px 3px;
    border-radius: 10px;
    background: rgba(255,255,255,.55);
    color: #806b59;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
}

.level.active {
    background: #ffd34e;
    color: #563a18;
    box-shadow: 0 3px 0 #c49a24;
}

/* =========================
   遊戲區
========================= */

.game-area {
    position: relative;
    background:
        linear-gradient(#8ed45f 0 65%, #67b94c 65% 100%);

    border-radius: 25px;
    padding: 16px;
    box-shadow:
        inset 0 0 0 5px rgba(255,255,255,.3),
        0 8px 20px rgba(0,0,0,.18);

    overflow: hidden;
}

/* 草地裝飾 */

.grass {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30px;
    pointer-events: none;
    opacity: .35;
}

/* =========================
   地鼠洞
========================= */

.board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    z-index: 2;
}

.hole {
    position: relative;
    aspect-ratio: 1 / .9;
    overflow: hidden;
    border-radius: 50%;
    background:
        radial-gradient(ellipse at center,
        #2e1a11 0%,
        #442718 45%,
        #6b4227 48%,
        #4b2e1c 75%);

    box-shadow:
        inset 0 7px 10px rgba(0,0,0,.5),
        0 5px 0 rgba(65,41,22,.35);

    cursor: pointer;
    touch-action: manipulation;
}

/* =========================
   地鼠
========================= */

.mole {
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: -5%;
    height: 88%;

    transform: translateY(110%);
    transition: transform .12s ease-out;

    cursor: pointer;
    user-select: none;
    z-index: 3;
}

.mole.show {
    transform: translateY(0);
}

.mole-inner {
    position: relative;
    width: 100%;
    height: 100%;
}

/* 身體 */

.mole-body {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 0;
    height: 85%;

    background:
        radial-gradient(circle at 35% 30%, #9a6742 0 7%, transparent 8%),
        linear-gradient(135deg, #825333, #55311f);

    border-radius: 48% 48% 35% 35%;
    border: 3px solid #432618;
}

/* 耳朵 */

.ear {
    position: absolute;
    width: 25%;
    height: 25%;
    top: 8%;
    border-radius: 50%;
    background: #805338;
    border: 3px solid #432618;
}

.ear.left {
    left: 5%;
}

.ear.right {
    right: 5%;
}

/* 臉 */

.face {
    position: absolute;
    left: 15%;
    right: 15%;
    top: 15%;
    height: 55%;
    border-radius: 50%;
    background: #96613c;
    border: 3px solid #432618;
}

/* 眼睛 */

.eye {
    position: absolute;
    top: 28%;
    width: 13%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #111;
}

.eye.left {
    left: 28%;
}

.eye.right {
    right: 28%;
}

/* 鼻子 */

.nose {
    position: absolute;
    left: 42%;
    top: 50%;
    width: 16%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #e28b85;
    border: 2px solid #633532;
}

/* 嘴巴 */

.mouth {
    position: absolute;
    left: 42%;
    top: 66%;
    width: 16%;
    height: 10%;
    border-bottom: 3px solid #432618;
    border-radius: 50%;
}

/* =========================
   打中效果
========================= */

.hit-effect {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    font-size: 30px;
    font-weight: 900;
    color: #ffe34c;
    text-shadow:
        2px 2px 0 #8c571c,
        0 0 8px rgba(255,255,255,.8);

    animation: hitFloat .65s ease-out forwards;
}

@keyframes hitFloat {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.7);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -130%) scale(1.4);
    }
}

/* =========================
   打擊動畫
========================= */

.mole.whacked {
    animation: whack .25s ease-out;
}

@keyframes whack {
    0% {
        transform: translateY(0) rotate(0);
    }

    30% {
        transform: translateY(-8px) rotate(-10deg) scale(1.05);
    }

    100% {
        transform: translateY(100%) rotate(20deg) scale(.8);
    }
}

/* =========================
   倒數
========================= */

.countdown {
    position: absolute;
    inset: 0;
    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.35);
    backdrop-filter: blur(2px);

    font-size: clamp(70px, 20vw, 120px);
    font-weight: 900;
    color: white;
    text-shadow: 0 6px 0 rgba(0,0,0,.4);

    opacity: 0;
    pointer-events: none;
}

.countdown.show {
    opacity: 1;
}

/* =========================
   開始畫面
========================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(30,25,15,.7);
    backdrop-filter: blur(5px);
}

.modal {
    width: min(440px, 95vw);
    background: #fffdf3;
    border-radius: 25px;
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
    animation: popIn .25s ease-out;
}

@keyframes popIn {
    from {
        transform: scale(.8);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.modal h2 {
    margin: 0 0 10px;
    font-size: 30px;
    color: #56341f;
}

.modal p {
    margin: 8px 0;
    line-height: 1.7;
    color: #665548;
}

.big-btn {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border-radius: 16px;

    background: #f2a52b;
    color: white;

    font-size: 19px;

    box-shadow: 0 6px 0 #b66e16;
}

.big-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b66e16;
}

.hidden {
    display: none !important;
}

/* =========================
   手機最佳化
========================= */

@media (max-width: 480px) {

    .game {
        padding: 8px;
    }

    .info {
        gap: 5px;
    }

    .info-box {
        padding: 6px 2px;
    }

    .info-value {
        font-size: 18px;
    }

    .game-area {
        padding: 11px;
        border-radius: 20px;
    }

    .board {
        gap: 8px;
    }

    .control-btn {
        padding: 10px 5px;
        font-size: 13px;
    }
}

/* =========================
   晃動
========================= */

.shake {
    animation: shake .25s;
}

@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-6px);
    }

    75% {
        transform: translateX(6px);
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="title">🐹 打地鼠大作戰</div>
        <div class="subtitle">眼明手快！把地鼠通通打回洞裡！</div>
    </div>

    <div class="info">

        <div class="info-box">
            <div class="info-label">分數</div>
            <div class="info-value" id="score">0</div>
        </div>

        <div class="info-box">
            <div class="info-label">時間</div>
            <div class="info-value" id="time">30</div>
        </div>

        <div class="info-box">
            <div class="info-label">最高分</div>
            <div class="info-value" id="highScore">0</div>
        </div>

        <div class="info-box">
            <div class="info-label">關卡</div>
            <div class="info-value" id="levelNumber">1</div>
        </div>

    </div>

    <div class="controls">
        <button class="control-btn" id="restartBtn">
            🔄 重新開始
        </button>

        <button class="control-btn music-btn" id="musicBtn">
            🔊 音樂：開
        </button>
    </div>

    <div class="level-bar">

        <div class="level active" id="level1">
            第一關
        </div>

        <div class="level" id="level2">
            第二關
        </div>

        <div class="level" id="level3">
            第三關
        </div>

    </div>

    <div class="game-area" id="gameArea">

        <div class="board" id="board"></div>

        <div class="grass">
            🌱 🌿 🌱 🌿 🌱 🌿 🌱 🌿 🌱 🌿
        </div>

        <div class="countdown" id="countdown">
            3
        </div>

    </div>

</div>


<!-- 開始 / 結束視窗 -->

<div class="overlay" id="overlay">

    <div class="modal">

        <h2 id="modalTitle">
            🐹 打地鼠大作戰
        </h2>

        <p id="modalText">
            準備好了嗎？<br>
            趕快點擊冒出來的地鼠！
        </p>

        <button class="big-btn" id="modalBtn">
            🎮 開始遊戲
        </button>

    </div>

</div>


<script>

/* =====================================================
   遊戲設定
===================================================== */

const LEVELS = [

    {
        level: 1,
        name: "第一關",
        time: 30,
        target: 15,
        spawnMin: 850,
        spawnMax: 1250,
        moleCount: 1
    },

    {
        level: 2,
        name: "第二關",
        time: 30,
        target: 30,
        spawnMin: 550,
        spawnMax: 850,
        moleCount: 1
    },

    {
        level: 3,
        name: "第三關",
        time: 30,
        target: 50,
        spawnMin: 300,
        spawnMax: 550,
        moleCount: 2
    }

];


/* =====================================================
   DOM
===================================================== */

const board = document.getElementById("board");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const highScoreElement = document.getElementById("highScore");
const levelNumberElement = document.getElementById("levelNumber");

const restartBtn = document.getElementById("restartBtn");
const musicBtn = document.getElementById("musicBtn");

const overlay = document.getElementById("overlay");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
const modalBtn = document.getElementById("modalBtn");

const countdown = document.getElementById("countdown");
const gameArea = document.getElementById("gameArea");


/* =====================================================
   遊戲狀態
===================================================== */

let currentLevel = 0;

let score = 0;
let timeLeft = 30;

let gameRunning = false;

let timerInterval = null;
let spawnTimeout = null;

let activeMoles = new Set();

let highScore =
    Number(localStorage.getItem("whackMoleHighScore")) || 0;

highScoreElement.textContent = highScore;


/* =====================================================
   音效系統
   使用 Web Audio API
   不需要外部 MP3
===================================================== */

let audioContext = null;
let musicEnabled = true;

let musicTimer = null;
let musicStep = 0;

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


/* -------------------------
   播放單音
------------------------- */

function playTone(
    frequency,
    duration = .1,
    type = "sine",
    volume = .05
) {

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}


/* -------------------------
   打中音效
------------------------- */

function playHitSound() {

    initAudio();

    playTone(620, .08, "square", .06);

    setTimeout(() => {
        playTone(920, .1, "square", .04);
    }, 50);
}


/* -------------------------
   錯誤音效
------------------------- */

function playMissSound() {

    initAudio();

    playTone(160, .15, "sawtooth", .04);

}


/* -------------------------
   過關音效
------------------------- */

function playWinSound() {

    initAudio();

    const notes = [
        523,
        659,
        784,
        1047
    ];

    notes.forEach((note, index) => {

        setTimeout(() => {

            playTone(
                note,
                .18,
                "triangle",
                .06
            );

        }, index * 120);

    });

}


/* -------------------------
   背景音樂
------------------------- */

const melody = [

    262, 330, 392, 330,
    294, 349, 440, 349,

    262, 330, 392, 523,
    440, 392, 330, 294

];

function startMusic() {

    if (!musicEnabled) return;

    initAudio();

    stopMusic();

    musicStep = 0;

    musicTimer = setInterval(() => {

        if (!gameRunning) return;

        playTone(
            melody[musicStep],
            .22,
            "triangle",
            .025
        );

        musicStep++;

        if (musicStep >= melody.length) {
            musicStep = 0;
        }

    }, 260);

}


function stopMusic() {

    if (musicTimer) {

        clearInterval(musicTimer);

        musicTimer = null;

    }

}


/* =====================================================
   建立遊戲版面
===================================================== */

function createBoard() {

    board.innerHTML = "";

    activeMoles.clear();

    for (let i = 0; i < 9; i++) {

        const hole =
            document.createElement("div");

        hole.className = "hole";

        hole.dataset.index = i;

        /* 建立地鼠 */

        const mole =
            document.createElement("div");

        mole.className = "mole";

        mole.innerHTML = `

            <div class="mole-inner">

                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="mole-body">

                    <div class="face">

                        <div class="eye left"></div>
                        <div class="eye right"></div>

                        <div class="nose"></div>

                        <div class="mouth"></div>

                    </div>

                </div>

            </div>

        `;

        hole.appendChild(mole);

        board.appendChild(hole);

    }

}


/* =====================================================
   隨機地鼠
===================================================== */

function getRandomHole() {

    const holes =
        [...document.querySelectorAll(".hole")];

    const available =
        holes.filter(
            hole =>
                !activeMoles.has(hole)
        );

    if (available.length === 0) {
        return null;
    }

    return available[
        Math.floor(
            Math.random() * available.length
        )
    ];

}


/* =====================================================
   出現地鼠
===================================================== */

function spawnMole() {

    if (!gameRunning) return;

    const level =
        LEVELS[currentLevel];

    const moleCount =
        Math.min(
            level.moleCount,
            9 - activeMoles.size
        );

    for (let i = 0; i < moleCount; i++) {

        const hole =
            getRandomHole();

        if (!hole) continue;

        const mole =
            hole.querySelector(".mole");

        activeMoles.add(hole);

        mole.classList.remove(
            "whacked"
        );

        /* 強制重繪動畫 */

        void mole.offsetWidth;

        mole.classList.add("show");

        /* 自動縮回 */

        const visibleTime =
            randomBetween(
                level.spawnMin * .75,
                level.spawnMax
            );

        setTimeout(() => {

            if (
                activeMoles.has(hole) &&
                mole.classList.contains("show")
            ) {

                mole.classList.remove(
                    "show"
                );

                activeMoles.delete(
                    hole
                );

            }

        }, visibleTime);

    }

    /* 下一波 */

    const nextTime =
        randomBetween(
            level.spawnMin,
            level.spawnMax
        );

    spawnTimeout =
        setTimeout(
            spawnMole,
            nextTime
        );

}


/* =====================================================
   點擊地鼠
===================================================== */

board.addEventListener("pointerdown", event => {

    if (!gameRunning) return;

    const mole =
        event.target.closest(".mole");

    if (!mole) {

        /* 點到洞但沒有地鼠 */

        playMissSound();

        score = Math.max(
            0,
            score - 1
        );

        updateUI();

        gameArea.classList.remove(
            "shake"
        );

        void gameArea.offsetWidth;

        gameArea.classList.add(
            "shake"
        );

        return;
    }

    if (!mole.classList.contains("show")) {
        return;
    }

    const hole =
        mole.closest(".hole");

    /* 防止同一隻地鼠重複點擊 */

    if (!activeMoles.has(hole)) {
        return;
    }

    activeMoles.delete(hole);

    /* 得分 */

    score += 1;

    /* 播放音效 */

    playHitSound();

    /* 打擊動畫 */

    mole.classList.remove("show");

    mole.classList.add("whacked");

    /* 顯示 +1 */

    showHitEffect(
        hole,
        "+1"
    );

    updateUI();

    /* 小延遲清除 */

    setTimeout(() => {

        mole.classList.remove(
            "whacked"
        );

    }, 250);

});


/* =====================================================
   顯示 +1
===================================================== */

function showHitEffect(
    element,
    text
) {

    const effect =
        document.createElement("div");

    effect.className =
        "hit-effect";

    effect.textContent =
        text;

    const rect =
        element.getBoundingClientRect();

    const areaRect =
        gameArea.getBoundingClientRect();

    effect.style.left =
        (rect.left - areaRect.left +
        rect.width / 2) + "px";

    effect.style.top =
        (rect.top - areaRect.top +
        rect.height / 2) + "px";

    gameArea.appendChild(effect);

    setTimeout(() => {
        effect.remove();
    }, 700);

}


/* =====================================================
   倒數
===================================================== */

function startCountdown(callback) {

    let count = 3;

    countdown.classList.add(
        "show"
    );

    countdown.textContent =
        count;

    initAudio();

    playTone(
        440,
        .15,
        "sine",
        .04
    );

    const interval =
        setInterval(() => {

            count--;

            if (count > 0) {

                countdown.textContent =
                    count;

                playTone(
                    440,
                    .15,
                    "sine",
                    .04
                );

            } else {

                countdown.textContent =
                    "GO!";

                playTone(
                    880,
                    .25,
                    "triangle",
                    .06
                );

                setTimeout(() => {

                    countdown.classList.remove(
                        "show"
                    );

                    clearInterval(
                        interval
                    );

                    callback();

                }, 450);

            }

        }, 700);

}


/* =====================================================
   開始遊戲
===================================================== */

function startGame() {

    initAudio();

    clearTimers();

    score = 0;

    const level =
        LEVELS[currentLevel];

    timeLeft =
        level.time;

    gameRunning =
        false;

    createBoard();

    updateUI();

    overlay.classList.add(
        "hidden"
    );

    startCountdown(() => {

        gameRunning = true;

        startMusic();

        spawnMole();

        startTimer();

    });

}


/* =====================================================
   計時器
===================================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );

    timerInterval =
        setInterval(() => {

            if (!gameRunning) return;

            timeLeft--;

            updateUI();

            if (timeLeft <= 0) {

                endLevel();

            }

        }, 1000);

}


/* =====================================================
   結束關卡
===================================================== */

function endLevel() {

    gameRunning = false;

    clearTimers();

    stopMusic();

    activeMoles.clear();

    document
        .querySelectorAll(".mole")
        .forEach(mole => {

            mole.classList.remove(
                "show"
            );

        });

    updateHighScore();

    const level =
        LEVELS[currentLevel];

    if (score >= level.target) {

        playWinSound();

        if (currentLevel < LEVELS.length - 1) {

            modalTitle.textContent =
                "🎉 關卡成功！";

            modalText.innerHTML =
                `
                你拿到了 <strong>${score}</strong> 分！<br>
                目標是 ${level.target} 分。<br>
                <br>
                準備挑戰下一關！
                `;

            modalBtn.textContent =
                "➡️ 下一關";

            modalBtn.onclick =
                nextLevel;

        } else {

            modalTitle.textContent =
                "🏆 恭喜破關！";

            modalText.innerHTML =
                `
                太厲害了！<br>
                三關全部完成！<br>
                <br>
                最終分數：
                <strong>${score}</strong>
                `;

            modalBtn.textContent =
                "🔄 再玩一次";

            modalBtn.onclick =
                restartGame;

        }

    } else {

        playMissSound();

        modalTitle.textContent =
            "😵 挑戰失敗";

        modalText.innerHTML =
            `
            這一關拿到
            <strong>${score}</strong> 分。<br>
            需要至少
            <strong>${level.target}</strong>
            分才能過關。
            `;

        modalBtn.textContent =
            "🔄 再試一次";

        modalBtn.onclick =
            restartGame;

    }

    overlay.classList.remove(
        "hidden"
    );

}


/* =====================================================
   下一關
===================================================== */

function nextLevel() {

    if (
        currentLevel <
        LEVELS.length - 1
    ) {

        currentLevel++;

        updateLevelDisplay();

        startGame();

    }

}


/* =====================================================
   重新開始
===================================================== */

function restartGame() {

    currentLevel = 0;

    updateLevelDisplay();

    startGame();

}


/* =====================================================
   清理計時器
===================================================== */

function clearTimers() {

    clearInterval(
        timerInterval
    );

    clearTimeout(
        spawnTimeout
    );

    timerInterval = null;

    spawnTimeout = null;

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    scoreElement.textContent =
        score;

    timeElement.textContent =
        timeLeft;

    levelNumberElement.textContent =
        currentLevel + 1;

    updateHighScore();

}


function updateHighScore() {

    if (score > highScore) {

        highScore =
            score;

        localStorage.setItem(
            "whackMoleHighScore",
            highScore
        );

    }

    highScoreElement.textContent =
        highScore;

}


function updateLevelDisplay() {

    document
        .querySelectorAll(".level")
        .forEach((element, index) => {

            element.classList.toggle(
                "active",
                index === currentLevel
            );

        });

    levelNumberElement.textContent =
        currentLevel + 1;

}


/* =====================================================
   隨機數
===================================================== */

function randomBetween(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
        + min
    );

}


/* =====================================================
   音樂按鈕
===================================================== */

musicBtn.addEventListener(
    "click",
    () => {

        initAudio();

        musicEnabled =
            !musicEnabled;

        if (musicEnabled) {

            musicBtn.textContent =
                "🔊 音樂：開";

            if (gameRunning) {
                startMusic();
            }

        } else {

            musicBtn.textContent =
                "🔇 音樂：關";

            stopMusic();

        }

    }
);


/* =====================================================
   重新開始按鈕
===================================================== */

restartBtn.addEventListener(
    "click",
    () => {

        initAudio();

        restartGame();

    }
);


/* =====================================================
   初始化
===================================================== */

createBoard();

updateUI();

updateLevelDisplay();


/* =====================================================
   避免手機長按選取
===================================================== */

document.addEventListener(
    "contextmenu",
    event => {

        if (
            event.target.closest(".hole")
        ) {

            event.preventDefault();

        }

    }
);

</script>

</body>
</html>
